<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>谊璜贸易 · 产品管理</title>
<link rel="stylesheet" href="../_shared/css/yihuang.css">
<style>
.prod-card .pc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.prod-card .pc-name{font-size:14px;font-weight:700}
.prod-card .pc-sku{font-size:10px;color:var(--text-muted);font-family:monospace}
.prod-card .pc-price-row{display:flex;gap:12px;margin-top:8px;font-size:12px}
.prod-card .pc-cost{color:var(--text-secondary)}
.prod-card .pc-sell{color:var(--accent);font-weight:700}
.prod-card .pc-cat{font-size:9px;padding:2px 8px;border-radius:10px;font-weight:600}
.cat-condiment{background:rgba(245,158,11,.15);color:#f59e0b}
.cat-grain{background:rgba(34,197,94,.15);color:#22c55e}
.cat-crossborder{background:rgba(56,189,248,.15);color:#38bdf8}
.cat-packaging{background:rgba(168,85,247,.15);color:#a855f7}
.cat-other{background:rgba(148,163,184,.15);color:#94a3b8}
</style>
</head>
<body>

<div class="top-bar">
  <div class="tb-left">
    <div class="tb-brand">📋 产品管理</div>
    <div class="tb-sub">产品目录 · 价格管理</div>
  </div>
  <div class="tb-right"><span class="tb-badge">v2.0</span></div>
</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="搜索产品名称/SKU..." oninput="render()">
  <button onclick="openPopup()">+ 新增</button>
</div>

<div class="filter-tabs" id="filterTabs"></div>

<div id="productList"></div>

<div class="popup-overlay" id="popup">
  <div class="popup">
    <h3 id="popupTitle">📋 新增产品</h3>
    <label>产品名称 <span style="color:var(--danger)">*</span></label>
    <input type="text" id="prodName" placeholder="产品名称">
    <label>SKU编码</label>
    <input type="text" id="prodSku" placeholder="SKU-001">
    <label>分类</label>
    <select id="prodCategory">
      <option value="condiment">调味品</option>
      <option value="grain">粮油</option>
      <option value="crossborder">跨境电商</option>
      <option value="packaging">包装材料</option>
      <option value="other">其他</option>
    </select>
    <label>成本价 (¥)</label>
    <input type="number" id="prodCostPrice" placeholder="0.00" step="0.01">
    <label>建议售价 (¥)</label>
    <input type="number" id="prodSellPrice" placeholder="0.00" step="0.01">
    <label>单位</label>
    <input type="text" id="prodUnit" placeholder="件/箱/kg...">
    <label>关联供应商</label>
    <select id="prodSupplier">
      <option value="">-- 选择供应商 --</option>
    </select>
    <label>备注</label>
    <textarea id="prodNotes" rows="2" placeholder="产品描述..."></textarea>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closePopup()">取消</button>
      <button class="btn btn-primary" onclick="save()">✅ 保存</button>
    </div>
    <input type="hidden" id="editId">
  </div>
</div>

<script src="../_shared/js/yihuang.js"></script>
<script src="../_shared/js/yihuang-db.js"></script>
<script>
const $=id=>document.getElementById(id);
let filter='all';
const catMap={condiment:'调味品',grain:'粮油',crossborder:'跨境电商',packaging:'包装材料',other:'其他'};
const catClass={condiment:'cat-condiment',grain:'cat-grain',crossborder:'cat-crossborder',packaging:'cat-packaging',other:'cat-other'};

function render(){
  const q=$('searchInput').value.toLowerCase();
  let products=YH.getProducts();
  if(filter!=='all')products=products.filter(p=>(p.category||'other')===filter);
  if(q)products=products.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.sku||'').toLowerCase().includes(q));

  const all=YH.getProducts();
  const tabs=[
    {id:'all',label:'全部('+all.length+')'},
    {id:'condiment',label:'调味品('+all.filter(p=>(p.category||'other')==='condiment').length+')'},
    {id:'grain',label:'粮油('+all.filter(p=>(p.category||'other')==='grain').length+')'},
    {id:'crossborder',label:'跨境('+all.filter(p=>(p.category||'other')==='crossborder').length+')'},
    {id:'packaging',label:'包装('+all.filter(p=>(p.category||'other')==='packaging').length+')'},
    {id:'other',label:'其他('+all.filter(p=>(p.category||'other')==='other').length+')'}
  ];
  $('filterTabs').innerHTML=tabs.map(t=>`<div class="filter-tab ${filter===t.id?'active':''}" onclick="filter='${t.id}';render()">${t.label}</div>`).join('');

  const el=$('productList');
  if(!products.length){
    el.innerHTML='<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">暂无产品</div><div class="empty-desc">点击"+新增"添加第一个产品</div></div>';
    return;
  }
  products.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  el.innerHTML=products.map(p=>{
    const cat=catMap[p.category]||'其他';
    const cls=catClass[p.category]||'cat-other';
    const supplier=p.supplierId?YH.getSupplierById(p.supplierId):null;
    return `
    <div class="item-card prod-card fade-in">
      <div class="pc-header">
        <div>
          <div class="pc-name">${p.name||'--'}</div>
          <div class="pc-sku">${p.sku||'无SKU'}</div>
        </div>
        <span class="pc-cat ${cls}">${cat}</span>
      </div>
      <div class="pc-price-row">
        <span class="pc-cost">成本: ¥${parseFloat(p.costPrice||0).toFixed(2)}</span>
        <span class="pc-sell">售价: ¥${parseFloat(p.sellPrice||0).toFixed(2)}</span>
        <span style="color:var(--text-muted);font-size:11px">${p.unit||''}</span>
      </div>
      ${supplier?'<div style="font-size:11px;color:var(--text-secondary);margin-top:4px">🏭 '+supplier.name+'</div>':''}
      ${p.notes?'<div style="font-size:11px;color:var(--text-muted);margin-top:4px">💬 '+p.notes+'</div>':''}
      <div class="actions">
        <span class="act-edit" onclick="edit('${p.id}')">✏️ 编辑</span>
        <span class="act-delete" onclick="del('${p.id}')">🗑 删除</span>
      </div>
    </div>`;
  }).join('');
}

function openPopup(){
  $('popupTitle').textContent='📋 新增产品';$('editId').value='';
  ['prodName','prodSku','prodCostPrice','prodSellPrice','prodUnit','prodNotes'].forEach(id=>$(id).value='');
  $('prodCategory').value='condiment';$('prodSupplier').value='';
  // Load suppliers
  const suppliers=YH.getSuppliers();
  $('prodSupplier').innerHTML='<option value="">-- 选择供应商 --</option>'+suppliers.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  $('popup').classList.add('show');
}
function closePopup(){$('popup').classList.remove('show')}

function save(){
  const name=$('prodName').value.trim();
  if(!name)return showToast('请输入产品名称');
  const editId=$('editId').value;
  const obj={
    name,sku:$('prodSku').value.trim(),
    category:$('prodCategory').value,
    costPrice:parseFloat($('prodCostPrice').value)||0,
    sellPrice:parseFloat($('prodSellPrice').value)||0,
    unit:$('prodUnit').value.trim(),
    supplierId:$('prodSupplier').value,
    notes:$('prodNotes').value.trim()
  };

  if(editId){
    const products=YH.getProducts();
    const p=products.find(x=>x.id===editId);
    if(p){Object.assign(p,obj);YH.saveProducts(products);}
  }else{
    YH.addProduct(obj);
  }
  render();closePopup();showToast('✅ 已保存');
}
function edit(id){
  const p=YH.getProducts().find(x=>x.id===id);
  if(!p)return;
  $('popupTitle').textContent='✏️ 编辑产品';$('editId').value=id;
  $('prodName').value=p.name||'';
  $('prodSku').value=p.sku||'';
  $('prodCategory').value=p.category||'condiment';
  $('prodCostPrice').value=p.costPrice||0;
  $('prodSellPrice').value=p.sellPrice||0;
  $('prodUnit').value=p.unit||'';
  $('prodNotes').value=p.notes||'';
  const suppliers=YH.getSuppliers();
  $('prodSupplier').innerHTML='<option value="">-- 选择供应商 --</option>'+suppliers.map(s=>`<option value="${s.id}" ${s.id===p.supplierId?'selected':''}>${s.name}</option>`).join('');
  $('popup').classList.add('show');
}
function del(id){
  if(!confirm('确定删除此产品？'))return;
  const products=YH.getProducts();
  YH.saveProducts(products.filter(p=>p.id!==id));
  render();showToast('🗑 已删除');
}

document.querySelectorAll('.popup-overlay').forEach(el=>{el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('show')})});
render();
</script>

<div class="bottom-nav" id="bottomNav"></div>
<script>document.getElementById('bottomNav').innerHTML=renderBottomNav('products');</script>
</body>
</html>
