<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>报价历史 — 谊璜贸易</title>
<link rel="stylesheet" href="../_shared/css/yihuang.css">
<style>
.history-list { margin:0; }
.quote-card { background:#1e293b; border:1px solid #334155; border-radius:10px; padding:14px; margin-bottom:10px; cursor:pointer; transition:all .15s; }
.quote-card:hover { border-color:#3b82f6; background:#1e3a5f; }
.quote-card .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.quote-card .client { font-size:16px; font-weight:600; color:#e2e8f0; }
.quote-card .amount { font-size:18px; font-weight:700; color:#38bdf8; }
.quote-card .mid { font-size:12px; color:#94a3b8; margin-bottom:8px; }
.quote-card .actions { display:flex; gap:8px; }
.quote-card .actions button { flex:1; padding:8px; border:none; border-radius:6px; font-size:13px; cursor:pointer; font-weight:500; }
.btn-view { background:#1e3a5f; color:#38bdf8; }
.btn-copy { background:#14532d; color:#86efac; }
.btn-copy:hover, .btn-view:hover { filter:brightness(1.3); }
.empty { text-align:center; padding:40px 20px; color:#64748b; }
.empty .icon { font-size:48px; margin-bottom:12px; }
.modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); z-index:900; overflow-y:auto; }
.modal-overlay.open { display:block; }
.modal-content { background:#1e293b; color:#e2e8f0; margin:20px auto; max-width:600px; border-radius:12px; padding:20px; }
.modal-content .close { float:right; background:none; border:none; color:#94a3b8; font-size:22px; cursor:pointer; }
.modal-content .close:hover { color:#fff; }
.quote-readonly { background:#fff; color:#1a1a1a; border-radius:6px; padding:24px; margin:16px 0; font-size:14px; line-height:2; }
.quote-readonly h2 { text-align:center; font-size:20px; margin-bottom:6px; }
.quote-readonly .company { text-align:center; font-size:13px; color:#555; margin-bottom:16px; }
.quote-readonly table { width:100%; border-collapse:collapse; margin:12px 0; }
.quote-readonly th { background:#f0f0f0; padding:8px 10px; text-align:left; font-size:12px; color:#333; border-bottom:2px solid #333; }
.quote-readonly td { padding:8px 10px; border-bottom:1px solid #ddd; font-size:13px; }
.quote-readonly .total { text-align:right; font-size:18px; font-weight:700; margin-top:16px; padding-top:8px; border-top:2px solid #333; }
.quote-readonly .meta { font-size:12px; color:#666; margin-top:12px; }
.quote-readonly .stamp { text-align:right; margin-top:24px; font-size:13px; color:#555; }
.search-bar { margin-bottom:12px; }
.search-bar input { width:100%; padding:10px 14px; background:#0f172a; color:#e2e8f0; border:1px solid #334155; border-radius:8px; font-size:14px; }
.toast { position:fixed; bottom:60px; left:50%; transform:translateX(-50%); background:#22c55e; color:#fff; padding:10px 24px; border-radius:20px; font-size:14px; z-index:1000; opacity:0; transition:opacity .3s; }
.toast.show { opacity:1; }
</style>
</head>
<body>
<div class="header">
  <h1>报价历史记录</h1>
  <p class="sub">查看、复制历史报价单</p>
</div>

<div class="card">
  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <button class="btn btn-outline" onclick="location.href='index.html'" style="flex:1;">新建报价</button>
  </div>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="搜索客户名称或报价编号..." oninput="renderList()">
  </div>
  <div class="history-list" id="historyList"></div>
</div>

<!-- View modal -->
<div class="modal-overlay" id="viewModal">
  <div class="modal-content">
    <button class="close" onclick="closeView()">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>
<div class="toast" id="toast"></div>

<script src="../_shared/js/yihuang-db.js"></script>
<script src="../_shared/js/yihuang.js"></script>
<script>
let allQuotes = [];

function loadQuotes() {
  allQuotes = YH.getQuotes().sort((a, b) => {
    const da = a.createdAt || a.date || '';
    const db = b.createdAt || b.date || '';
    return db.localeCompare(da);
  });
  renderList();
}

function renderList() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase();
  const filtered = q ? allQuotes.filter(item => {
    return (item.clientName || '').toLowerCase().includes(q) ||
           (item.quoteId || '').toLowerCase().includes(q);
  }) : allQuotes;

  const el = document.getElementById('historyList');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty"><div class="icon">📭</div><p>暂无报价记录</p><p style="font-size:12px;color:#475569;margin-top:4px;">保存报价后会自动出现在这里</p></div>';
    return;
  }
  el.innerHTML = filtered.map(q => {
    const date = (q.date || q.createdAt || '').slice(0, 10);
    const amount = (q.totalPrice || 0).toFixed(2);
    const items = (q.items || []).length;
    return `<div class="quote-card">
      <div class="top">
        <span class="client">${escHtml(q.clientName || '未命名客户')}</span>
        <span class="amount">¥${amount}</span>
      </div>
      <div class="mid">${q.quoteId || ''} · ${date} · ${items}件产品 · 毛利 ¥${(q.profit || 0).toFixed(2)}</div>
      <div class="actions">
        <button class="btn-view" onclick="viewQuote('${q.id}')">查看</button>
        <button class="btn-copy" onclick="copyQuote('${q.id}')">复制为新报价</button>
      </div>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function viewQuote(id) {
  const q = allQuotes.find(x => x.id === id);
  if (!q) return;
  const rows = (q.items || []).map(item => {
    const cost = (item.costPrice || 0) * (item.quantity || 1);
    const price = cost * (1 + (q.markup || 0) / 100);
    return `<tr><td>${escHtml(item.productName||item.productId||'-')}</td><td>${item.quantity}</td><td>¥${(item.costPrice||0).toFixed(2)}</td><td>¥${price.toFixed(2)}</td></tr>`;
  }).join('');
  const html = `<div class="quote-readonly">
    <h2>报 价 单</h2>
    <div class="company">谊璜贸易 | 编号: ${escHtml(q.quoteId||'')}</div>
    <table style="width:100%;margin-bottom:12px;">
      <tr><td style="border:none;font-size:13px;"><strong>客户:</strong> ${escHtml(q.clientName||'')}</td><td style="border:none;font-size:13px;text-align:right;"><strong>日期:</strong> ${(q.date||'').slice(0,10)}</td></tr>
    </table>
    <table><thead><tr><th>产品名称</th><th>数量</th><th>单价</th><th>金额</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="total">合计: ¥${(q.totalPrice||0).toFixed(2)}</div>
    <div class="meta">加价率: ${q.markup||0}% | 成本: ¥${(q.totalCost||0).toFixed(2)} | 毛利: ¥${(q.profit||0).toFixed(2)}</div>
    ${q.note ? `<div class="meta">备注: ${escHtml(q.note)}</div>` : ''}
    <div class="stamp">谊璜贸易<br>${(q.date||'').slice(0,10)}</div>
  </div>`;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('viewModal').classList.add('open');
}

function closeView() {
  document.getElementById('viewModal').classList.remove('open');
}

function copyQuote(id) {
  const toast = document.getElementById('toast');
  toast.textContent = '正在加载报价模板...';
  toast.classList.add('show');
  location.href = 'index.html?from=' + encodeURIComponent(id);
}

document.getElementById('viewModal').addEventListener('click', function(e) {
  if (e.target === this) closeView();
});

if (typeof renderBottomNav === 'function') {
  document.getElementById('bottomNav').innerHTML = renderBottomNav('quotes');
}
loadQuotes();
</script>
</body>
</html>
